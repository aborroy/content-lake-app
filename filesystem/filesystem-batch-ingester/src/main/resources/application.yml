server:
  port: 9095

spring:
  application:
    name: filesystem-batch-ingester

  ai:
    openai:
      # Spring AI 2.0 treats base-url as the FULL API base and appends `/embeddings` directly (no
      # `/v1`). MODEL_RUNNER_URL is a bare scheme://host:port, so `/v1` must be appended here.
      base-url: ${MODEL_RUNNER_URL:http://localhost:12434}/v1
      api-key: ${MODEL_RUNNER_API_KEY:not-needed}
      embedding:
        model: ${EMBEDDING_MODEL:ai/mxbai-embed-large}
      chat:
        options:
          model: ${LLM_MODEL:ai/gpt-oss}
          temperature: ${LLM_TEMPERATURE:0.1}

# Filesystem source connector
filesystem:
  root-path: ${FILESYSTEM_ROOT_PATH:/data/filesystem}
  source-id: ${FILESYSTEM_SOURCE_ID:filesystem}
  read-principals:
    - ${FILESYSTEM_READ_PRINCIPAL:__Everyone__}
  # Empty include-extensions means all files; set to restrict (e.g. pdf, docx, txt, md, html).
  include-extensions: ${FILESYSTEM_INCLUDE_EXTENSIONS:}
  exclude-patterns:
    - .git
    - node_modules
  page-size: ${FILESYSTEM_PAGE_SIZE:100}
  batch:
    # Credentials for this ingester's own REST API. No defaults: startup fails when either is unset,
    # because a default here would be a published credential on an endpoint that triggers a full
    # re-ingest.
    security:
      username: ${FILESYSTEM_SYNC_USERNAME:}
      password: ${FILESYSTEM_SYNC_PASSWORD:}
    # Post-discovery reconciliation sweep (#115). Deletes indexed documents a completed
    # discovery pass did not see, so a file removed from the mounted path does not outlive it as a
    # phantom search result. Off by default: it deletes documents, and the first sweep on a corpus
    # with accumulated drift will legitimately trip the guards.
    reconcile:
      enabled: ${FILESYSTEM_BATCH_RECONCILE_ENABLED:false}
      max-delete-ratio: ${FILESYSTEM_BATCH_RECONCILE_MAX_DELETE_RATIO:0.10}
      max-deletes: ${FILESYSTEM_BATCH_RECONCILE_MAX_DELETES:1000}
      max-seen-ids: ${FILESYSTEM_BATCH_RECONCILE_MAX_SEEN_IDS:200000}
      page-size: ${FILESYSTEM_BATCH_RECONCILE_PAGE_SIZE:200}
    executor:
      core-size: ${FILESYSTEM_BATCH_CORE_SIZE:1}
      max-size: ${FILESYSTEM_BATCH_MAX_SIZE:1}
      queue-capacity: ${FILESYSTEM_BATCH_QUEUE_CAPACITY:1000}
      await-termination-seconds: ${FILESYSTEM_BATCH_AWAIT_TERMINATION_SECONDS:30}
    embedding:
      min-chunk-size: ${EMBEDDING_MIN_CHUNK_SIZE:200}
      chunk-size: ${EMBEDDING_CHUNK_SIZE:1024}
      chunk-overlap: ${EMBEDDING_CHUNK_OVERLAP:256}
      similarity-threshold: ${EMBEDDING_SIMILARITY_THRESHOLD:0.75}
      # Must resolve to the same value in every module: the hxpr embedding type is derived from
      # it, and two writers deriving different types leave a document with children under both.
      model-name: ${EMBEDDING_MODEL_NAME:${EMBEDDING_MODEL:ai/mxbai-embed-large}}
      noise-reduction:
        enabled: ${NOISE_REDUCTION_ENABLED:true}
        aggressive: ${NOISE_REDUCTION_AGGRESSIVE:false}

# Optional transform engine for structure-aware extraction.
#
# This source has no repository transform service behind it, so extraction falls back to in-process
# Tika unless an engine is configured here. Leave engine-url empty and behaviour is exactly as before.
#
# The engine speaks the alfresco-transform-core /transform protocol directly rather than going through
# a repository, so it is not Alfresco-specific and can sit alongside this connector.
#
# format: plaintext (default) asks for text/plain; auto asks for text/markdown where the engine
# advertises it, so headings and table rows survive into chunking; markdown behaves like auto but logs
# each fall back to plaintext. Extraction always degrades rather than failing an ingest.
extraction:
  # Extraction services for this source, which has no repository transform service behind it. Empty
  # leaves extraction on in-process Tika, exactly as before. Comma separated, most structural first,
  # each optionally prefixed with a backend kind:
  #
  #   transform:http://transform-convert2md:8090,transform:http://transform-liteparse:8090
  #
  # An unprefixed entry means the alfresco-transform-core protocol. Other kinds (Document Filters, for
  # example) register an ExtractionBackend bean and are selected by their own prefix. Each service
  # claims only the MIME types it advertises, so a mixed list routes itself; order breaks ties.
  engine-urls: ${EXTRACTION_ENGINE_URLS:}
  engine-timeout-ms: ${EXTRACTION_ENGINE_TIMEOUT_MS:300000}
  format: ${EXTRACTION_FORMAT:plaintext}

hxpr:
  url: ${HXPR_URL:http://localhost:8080}
  repository-id: ${HXPR_REPOSITORY_ID:default}
  target-path: ${HXPR_TARGET_PATH:/filesystem-sync}
  path-repository-id: ${HXPR_PATH_REPOSITORY_ID:}
  # HTTP Basic credentials for the ai-ready-index engine (filestore user store).
  username: ${HXPR_USERNAME:admin}
  password: ${HXPR_PASSWORD:password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.alfresco.contentlake: ${LOG_LEVEL:INFO}

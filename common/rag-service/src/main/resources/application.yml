server:
  port: 9091

spring:
  application:
    name: rag-service

  # Spring Boot 4 switched the default JSON mapper to Jackson 3, which (unlike Jackson 2)
  # rejects a missing/null JSON value bound to a Java primitive with
  # "Cannot map `null` into type boolean". RagPromptRequest/search requests use primitive
  # fields (topK, minScore, resetSession, includeContext) with defaults, and real clients
  # (the ACA/demo UI) send partial JSON that omits them. Restore the lenient pre-Jackson-3
  # behavior so those requests bind to their defaults instead of returning HTTP 400.
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  ai:
    openai:
      # Spring AI 2.0 wraps the official openai-java SDK, which treats base-url as the FULL API
      # base and appends `/embeddings` and `/chat/completions` directly (it does NOT add `/v1`,
      # unlike the pre-2.0 Spring AI client). MODEL_RUNNER_URL is a bare scheme://host:port, so the
      # `/v1` segment must be appended here or every model call hits `.../embeddings` and 404s.
      # Docker Model Runner serves the OpenAI API under both `/v1` and `/engines/v1`.
      base-url: ${MODEL_RUNNER_URL:http://localhost:12434}/v1
      api-key: ${MODEL_RUNNER_API_KEY:not-needed}
      chat:
        options:
          model: ${LLM_MODEL:ai/gpt-oss}
          temperature: ${LLM_TEMPERATURE:0.3}
          maxTokens: ${LLM_MAX_TOKENS:2048}
      embedding:
        model: ${EMBEDDING_MODEL:ai/mxbai-embed-large}
    # MCP server (#61): exposes rag-service tools (secureSearch/getDocument/listSources) over the
    # Model Context Protocol. Synchronous WebMVC transport; tools run on the authenticated request
    # thread. Endpoint is behind the existing auth chain (HTTP Basic / Alfresco ticket).
    mcp:
      server:
        enabled: ${RAG_MCP_ENABLED:true}
        name: content-lake-mcp
        version: 1.0.0

# Alfresco SDK configuration
# Service account for internal operations (group resolution, metadata enrichment)
# API endpoints require per-request authentication with user credentials
content:
  service:
    url: ${ALFRESCO_URL:http://localhost:80}
    security:
      basicAuth:
        username: ${ALFRESCO_INTERNAL_USERNAME:admin}
        password: ${ALFRESCO_INTERNAL_PASSWORD:admin}

nuxeo:
  base-url: ${NUXEO_URL:http://localhost:8081/nuxeo}
  username: ${NUXEO_USERNAME:Administrator}
  password: ${NUXEO_PASSWORD:Administrator}
  source-id: ${NUXEO_SOURCE_ID:}

# hxpr Content Lake connection
hxpr:
  url: ${HXPR_URL:http://localhost:8080}
  repository-id: ${HXPR_REPOSITORY_ID:default}
  # HTTP Basic credentials for the ai-ready-index engine (filestore user store).
  username: ${HXPR_USERNAME:admin}
  password: ${HXPR_PASSWORD:password}

# RAG configuration
rag:
  default-top-k: ${RAG_DEFAULT_TOP_K:15}
  default-min-score: ${RAG_DEFAULT_MIN_SCORE:0.01}
  max-context-length: ${RAG_MAX_CONTEXT_LENGTH:20000}
  use-hybrid-search: ${RAG_USE_HYBRID_SEARCH:true}
  default-system-prompt: >
    You are a document assistant that answers questions based strictly on the provided context.

    RULES:
    1. Use ONLY information from the DOCUMENT CONTEXT below. Do not use prior knowledge.
    2. Answer completely. Include every fact, number, name, date, code, and identifier from
    the sources that is relevant to the question. Missing a key detail is worse than being
    slightly long.
    3. Start your answer directly with the relevant information. Do not begin with phrases
    like "Based on the provided context", "According to the documents", or similar preambles.
    4. When referencing information, cite the source using its label (e.g. "Source 1 states...").
    Cite each source once per answer, not once per sentence.
    5. If multiple sources contain relevant information, synthesize them and cite each.
    6. For questions asking about lists, steps, specifications, or enumerations, use a numbered
    or bulleted list.
    7. If you can answer part of the question from the context, do so, then note what is
    genuinely missing. Do not refuse the whole question because one detail is unclear.
    8. Be concise -- do not repeat yourself or add unnecessary filler -- but completeness
    takes priority over brevity.
    9. You may apply standard world knowledge for unit conversions (temperatures, currencies,
    UTC offsets) when the document context provides the underlying fact but not the converted
    value. Do not invent document facts.
  reranker:
    url: ${RAG_RERANKER_URL:}
    top-n: ${RAG_RERANKER_TOP_N:8}
    enabled: ${RAG_RERANKER_ENABLED:false}
  mmr:
    enabled: ${RAG_MMR_ENABLED:false}
    lambda: ${RAG_MMR_LAMBDA:0.5}
    pool-size: ${RAG_MMR_POOL_SIZE:30}
  conversation:
    enabled: ${RAG_CONVERSATION_ENABLED:true}
    max-history-turns: ${RAG_CONVERSATION_MAX_HISTORY_TURNS:10}
    session-ttl-minutes: ${RAG_CONVERSATION_SESSION_TTL_MINUTES:30}
    query-reformulation: ${RAG_CONVERSATION_QUERY_REFORMULATION:true}
    # Persistent running summary in hxpr. Off until the sessions folder is provisioned.
    summary:
      enabled: ${RAG_CONVERSATION_SUMMARY_ENABLED:false}
      base-path: ${RAG_CONVERSATION_SUMMARY_BASE_PATH:/_sessions}
  # Query expansion. Shared bounds for multi-query, HyDE and decomposition, all of which append to the
  # same variant list; max-variants is the ceiling on the per-request embedding and hxpr call count.
  # Multi-embedding-type retrieval (#121). additional-models is empty by default, which leaves the
  # vector leg on the single-type path it has always used. Naming a model here lets its embedding type
  # be queried in its own vector space, which is what keeps recall from dropping for documents still on
  # a previous model during a migration. Coexisting types must share vector dimensionality.
  embedding:
    additional-models: ${RAG_EMBEDDING_ADDITIONAL_MODELS:}
    type-discovery:
      enabled: ${RAG_EMBEDDING_TYPE_DISCOVERY_ENABLED:true}
      ttl-seconds: ${RAG_EMBEDDING_TYPE_DISCOVERY_TTL_SECONDS:300}
    # Re-embeds the corpus into the configured type while the previous one keeps serving queries. Off
    # by default, and operator-gated: it writes to every document and spends embedding throughput.
    backfill:
      enabled: ${RAG_EMBEDDING_BACKFILL_ENABLED:false}
      docs-per-minute: ${RAG_EMBEDDING_BACKFILL_DOCS_PER_MINUTE:60}
      operator-users: ${RAG_EMBEDDING_BACKFILL_OPERATOR_USERS:}
  # rrf-k here fuses across variants, one level above search.hybrid.rrf-k which fuses the two legs.
  query-expansion:
    max-variants: ${RAG_QUERY_EXPANSION_MAX_VARIANTS:6}
    rrf-k: ${RAG_QUERY_EXPANSION_RRF_K:60}
  multi-query:
    enabled: ${RAG_MULTI_QUERY_ENABLED:false}
    variants: ${RAG_MULTI_QUERY_VARIANTS:3}
  hyde:
    enabled: ${RAG_HYDE_ENABLED:false}
    max-chars: ${RAG_HYDE_MAX_CHARS:1000}
  query-decomposition:
    enabled: ${RAG_QUERY_DECOMPOSITION_ENABLED:false}
    max-sub-questions: ${RAG_QUERY_DECOMPOSITION_MAX_SUB_QUESTIONS:4}
  # Self-RAG relevance gate. min-score is on the fusion's scale, not cosine's (see
  # RagProperties.RetrievalGradingProperties), so 0.0 leaves the gate inert even when enabled.
  retrieval-grading:
    enabled: ${RAG_RETRIEVAL_GRADING_ENABLED:false}
    min-score: ${RAG_RETRIEVAL_GRADING_MIN_SCORE:0.0}
    min-hits: ${RAG_RETRIEVAL_GRADING_MIN_HITS:1}
    broaden: ${RAG_RETRIEVAL_GRADING_BROADEN:true}
  # Intent-aware filter inference (opt-in per request via inferFilters). category-property is the
  # ingest-property key a inferred category maps to; blank disables category inference.
  filter-inference:
    category-property: ${RAG_FILTER_INFERENCE_CATEGORY_PROPERTY:}
  # Post-generation citation faithfulness verification. Off by default (adds an LLM call per answer).
  citation:
    verify:
      enabled: ${RAG_CITATION_VERIFY_ENABLED:false}
  # Prompt-injection defense on retrieved document content (#71). Both flags off by default so the
  # eval baseline is preserved until the generation delta / false-positive rate are characterized.
  prompt-injection:
    defense-enabled: ${RAG_PROMPT_INJECTION_DEFENSE_ENABLED:false}
    scan-enabled: ${RAG_PROMPT_INJECTION_SCAN_ENABLED:false}
  # Per-principal rate limiting (#75). Off by default. Generation endpoints get a tighter budget than
  # search given the per-request LLM cost. Buckets are in-memory (per-instance).
  rate-limit:
    enabled: ${RAG_RATE_LIMIT_ENABLED:false}
    generate-requests-per-minute: ${RAG_RATE_LIMIT_GENERATE_RPM:20}
    search-requests-per-minute: ${RAG_RATE_LIMIT_SEARCH_RPM:60}
  # Agentic tool-calling during generation (#65). Off by default (extra LLM round-trips). All
  # tool-invoked retrieval is ACL-scoped to the request principal.
  agentic-tools:
    enabled: ${RAG_AGENTIC_TOOLS_ENABLED:false}
    max-iterations: ${RAG_AGENTIC_TOOLS_MAX_ITERATIONS:2}
  # MCP server (#61). Enabled by default; gated together with spring.ai.mcp.server.enabled by the same
  # env var so the tools and the transport switch on/off together.
  mcp:
    enabled: ${RAG_MCP_ENABLED:true}
  # Small-to-big (parent-child) retrieval: expand each hit to its parent section for LLM context.
  retrieval:
    small-to-big:
      enabled: ${RAG_RETRIEVAL_SMALL_TO_BIG_ENABLED:false}
      max-section-chars: ${RAG_RETRIEVAL_SMALL_TO_BIG_MAX_SECTION_CHARS:4000}
    # Verbatim matching for identifier-like queries (#122). A short alphanumeric identifier embeds
    # poorly because the token is rare, not because the query is ambiguous, which is why query expansion
    # does not rescue it. When the query names one, an extra pass restricts the search to chunks holding
    # the token literally. Off by default until the eval confirms the gain; when it matches nothing the
    # ranking is the one the search would have produced anyway.
    verbatim-identifier:
      enabled: ${RAG_VERBATIM_IDENTIFIER_ENABLED:false}
      min-length: ${RAG_VERBATIM_IDENTIFIER_MIN_LENGTH:3}
      max-terms: ${RAG_VERBATIM_IDENTIFIER_MAX_TERMS:2}
  # In-app evaluation smoke endpoint. Off by default; content-lake-eval is the authoritative gate.
  evaluation:
    enabled: ${RAG_EVALUATION_ENABLED:false}
  # Semantic query-result caching (#72). Off by default so the eval baseline is unchanged. When on,
  # repeated query+filter+principal combinations skip re-embedding and retrieval within the TTL.
  # Result-cache keys include the authenticated principal, so entries never cross ACL contexts;
  # ttl-seconds bounds how stale a principal's group membership may be.
  cache:
    enabled: ${RAG_CACHE_ENABLED:false}
    ttl-seconds: ${RAG_CACHE_TTL_SECONDS:60}
    max-size: ${RAG_CACHE_MAX_SIZE:1000}
  # What to do when a caller's group membership cannot be resolved against a source repository.
  # fail-closed (the default) excludes that source from the permission filter, so a directory outage
  # narrows results; degrade proceeds with the caller's own name plus GROUP_EVERYONE, so the caller
  # silently loses group-granted documents instead. Both modes log at WARN. An unrecognised value is
  # read as fail-closed.
  security:
    group-resolution-failure: ${RAG_SECURITY_GROUP_RESOLUTION_FAILURE:fail-closed}
    # Whether GROUP_ALFRESCO_ADMINISTRATORS reads an Alfresco source without any sys_racl condition.
    # Off by default: an Alfresco administrator sees what their own ACLs allow, like everyone else.
    # Turn it on where repository-admin discoverability is wanted (the demo stack does), knowing it
    # means one group membership grants read access to every document of that source.
    admin-bypass:
      enabled: ${RAG_SECURITY_ADMIN_BYPASS_ENABLED:false}
  # User feedback capture (#74). Enabled by default; POST /api/rag/feedback persists a rating for an
  # answer as an hxpr document under base-path, feeding the offline evaluation corpus.
  feedback:
    enabled: ${RAG_FEEDBACK_ENABLED:true}
    base-path: ${RAG_FEEDBACK_BASE_PATH:/_feedback}
    # Accounts that may list every submitter's feedback (GET /api/rag/feedback?scope=all), which the
    # evaluation harness needs. Empty by default: a caller who is merely authenticated reads their own
    # entries and gets 403 on the aggregate view, because a feedback entry holds a user's question and
    # the answer they were given.
    operator-users: ${RAG_FEEDBACK_OPERATOR_USERS:}

  # Span payloads (#116). Both switches off by default, and they are different decisions.
  #
  # payloads-enabled is operational verbosity: note that "off" does not mean the spans are absent,
  # because with actuator on the classpath the ObservationRegistry is never a no-op and the spans exist
  # on every request regardless. What this governs is whether each one pays an O(hits) payload build,
  # which is wasted work when nothing is exported. Turn it on together with
  # management.otlp.tracing.endpoint.
  #
  # capture-content is a data-protection decision, not a verbosity one: it copies the question, the
  # retrieved chunk text, source names and paths, and the answer into the trace backend, whose readers
  # are whoever can reach it rather than the ACL that governed the retrieval. See
  # docs/security-model.md. Leave it false unless the backend is inside the same trust boundary as the
  # index.
  observability:
    payloads-enabled: ${RAG_OBSERVABILITY_PAYLOADS_ENABLED:false}
    capture-content: ${RAG_OBSERVABILITY_CAPTURE_CONTENT:false}
    max-chunks-recorded: ${RAG_OBSERVABILITY_MAX_CHUNKS_RECORDED:20}
    max-content-chars: ${RAG_OBSERVABILITY_MAX_CONTENT_CHARS:2000}

# Semantic Search configuration
semantic-search:
  default-min-score: ${SEMANTIC_SEARCH_MIN_SCORE:0.2}

# Hybrid Search configuration (vector + keyword fusion)
search:
  hybrid:
    enabled: ${SEARCH_HYBRID_ENABLED:${HYBRID_SEARCH_ENABLED:true}}
    strategy: ${SEARCH_HYBRID_STRATEGY:${HYBRID_SEARCH_STRATEGY:rrf}}
    normalization: ${SEARCH_HYBRID_NORMALIZATION:${HYBRID_SEARCH_NORMALIZATION:max}}
    vector-weight: ${SEARCH_HYBRID_VECTOR_WEIGHT:${HYBRID_SEARCH_VECTOR_WEIGHT:0.7}}
    text-weight: ${SEARCH_HYBRID_TEXT_WEIGHT:${HYBRID_SEARCH_TEXT_WEIGHT:0.3}}
    initial-candidates: ${SEARCH_HYBRID_INITIAL_CANDIDATES:${HYBRID_SEARCH_CANDIDATE_COUNT:75}}
    final-results: ${SEARCH_HYBRID_FINAL_RESULTS:${HYBRID_SEARCH_MAX_RESULTS:20}}
    rrf-k: ${SEARCH_HYBRID_RRF_K:${HYBRID_SEARCH_RRF_K:60}}
    default-min-score: ${SEARCH_HYBRID_MIN_SCORE:${HYBRID_SEARCH_MIN_SCORE:0.01}}

# Chunking parameters, read only by the embedding backfill (#121). It re-chunks stored text, so these
# must be the same EMBEDDING_* values the ingesters use, or a backfilled document would be chunked
# differently from a synced one.
embedding:
  min-chunk-size: ${EMBEDDING_MIN_CHUNK_SIZE:200}
  chunk-size: ${EMBEDDING_CHUNK_SIZE:1024}
  chunk-overlap: ${EMBEDDING_CHUNK_OVERLAP:256}
  similarity-threshold: ${EMBEDDING_SIMILARITY_THRESHOLD:0.75}
  noise-reduction:
    enabled: ${NOISE_REDUCTION_ENABLED:true}
    aggressive: ${NOISE_REDUCTION_AGGRESSIVE:false}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Surface the custom hxpr / modelRunner health contributors on /actuator/health.
      show-components: always
      show-details: when-authorized
  # Distributed tracing (#73, payloads #116). Micrometer Tracing (OpenTelemetry bridge) spans the
  # request, the retrieve and augment phases, the embedding and search calls, and generation.
  #
  # This is the only sampling knob: rag.observability.* deliberately does not add a second one, which
  # would interact multiplicatively with this and would not be the key an operator reaches for. The two
  # are orthogonal -- this bounds how many spans are exported, rag.observability.payloads-enabled
  # bounds what each span costs to build and what it carries.
  #
  # Sampling is low in production and can be raised to 1.0 in dev. The OTLP exporter endpoint is blank
  # by default, so spans are created (and trace/span ids reach the logs via MDC) but nothing is
  # exported until a collector endpoint is configured.
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      # e.g. http://otel-collector:4318/v1/traces -- unset means "do not export".
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:}

logging:
  # Correlate log lines with traces: the Micrometer OTel bridge populates traceId/spanId in the MDC.
  pattern:
    correlation: "[${spring.application.name:rag-service},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
  level:
    org.alfresco.contentlake: ${LOG_LEVEL:INFO}

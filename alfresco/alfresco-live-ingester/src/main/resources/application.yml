server:
  port: 9092

spring:
  application:
    name: live-ingester

  # The Alfresco ACS REST starter (content-lake-source-alfresco) wires its Feign handlers via
  # spring-cloud-openfeign 4.2.1, which is NOT Spring Boot 4 compatible: its auto-configurations
  # reference Boot classes that Boot 4 relocated/removed (web.ServerProperties,
  # web.context.WebServerInitializedEvent, data.web.SpringDataWebProperties) and fail context
  # refresh with NoClassDefFoundError. We build the NodesApi/DiscoveryApi/SearchApi handlers
  # ourselves with plain OpenFeign in AlfrescoFeignConfig, so ALL spring-cloud auto-configuration
  # (which self-registers from the jars on the classpath) plus the ACS starter's @EnableFeignClients
  # must be disabled. See issue #77. The spring-cloud-openfeign-core JAR stays on the classpath
  # because AlfrescoFeignConfig reuses its (Boot-independent) SpringMvcContract + ResponseEntityDecoder.
  autoconfigure:
    exclude:
      - org.alfresco.rest.sdk.config.AlfrescoRestApiAutoConfiguration
      # spring-cloud-commons
      - org.springframework.cloud.client.CommonsClientAutoConfiguration
      - org.springframework.cloud.client.ReactiveCommonsClientAutoConfiguration
      - org.springframework.cloud.client.discovery.composite.CompositeDiscoveryClientAutoConfiguration
      - org.springframework.cloud.client.discovery.composite.reactive.ReactiveCompositeDiscoveryClientAutoConfiguration
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
      - org.springframework.cloud.client.discovery.simple.reactive.SimpleReactiveDiscoveryClientAutoConfiguration
      - org.springframework.cloud.client.hypermedia.CloudHypermediaAutoConfiguration
      - org.springframework.cloud.client.loadbalancer.LoadBalancerAutoConfiguration
      - org.springframework.cloud.client.loadbalancer.LoadBalancerDefaultMappingsProviderAutoConfiguration
      - org.springframework.cloud.client.loadbalancer.reactive.LoadBalancerBeanPostProcessorAutoConfiguration
      - org.springframework.cloud.client.loadbalancer.reactive.ReactorLoadBalancerClientAutoConfiguration
      - org.springframework.cloud.client.serviceregistry.ServiceRegistryAutoConfiguration
      - org.springframework.cloud.client.serviceregistry.AutoServiceRegistrationAutoConfiguration
      - org.springframework.cloud.commons.util.UtilAutoConfiguration
      - org.springframework.cloud.commons.security.ResourceServerTokenRelayAutoConfiguration
      - org.springframework.cloud.commons.config.CommonsConfigAutoConfiguration
      - org.springframework.cloud.configuration.CompatibilityVerifierAutoConfiguration
      # spring-cloud-context
      - org.springframework.cloud.autoconfigure.ConfigurationPropertiesRebinderAutoConfiguration
      - org.springframework.cloud.autoconfigure.LifecycleMvcEndpointAutoConfiguration
      - org.springframework.cloud.autoconfigure.RefreshAutoConfiguration
      - org.springframework.cloud.autoconfigure.RefreshEndpointAutoConfiguration
      - org.springframework.cloud.autoconfigure.WritableEnvironmentEndpointAutoConfiguration
      # spring-cloud-openfeign-core
      - org.springframework.cloud.openfeign.hateoas.FeignHalAutoConfiguration
      - org.springframework.cloud.openfeign.FeignAutoConfiguration
      - org.springframework.cloud.openfeign.encoding.FeignAcceptGzipEncodingAutoConfiguration
      - org.springframework.cloud.openfeign.encoding.FeignContentGzipEncodingAutoConfiguration
      - org.springframework.cloud.openfeign.loadbalancer.FeignLoadBalancerAutoConfiguration

  activemq:
    broker-url: ${ACTIVEMQ_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
  jms:
    cache:
      enabled: false

  ai:
    openai:
      # Spring AI 2.0 wraps the openai-java SDK, which treats base-url as the FULL API base and
      # appends `/embeddings` directly (it does NOT add `/v1`). MODEL_RUNNER_URL is a bare
      # scheme://host:port, so `/v1` must be appended here or every embedding call 404s and
      # ingestion silently stores no vectors (issue #79; matches the rag-service fix).
      base-url: ${MODEL_RUNNER_URL:http://localhost:12434}/v1
      api-key: ${MODEL_RUNNER_API_KEY:not-needed}
      embedding:
        model: ${EMBEDDING_MODEL:ai/mxbai-embed-large}
      chat:
        options:
          model: ${LLM_MODEL:ai/gpt-oss}
          temperature: ${LLM_TEMPERATURE:0.1}
    retry:
      max-attempts: 1

# Alfresco SDK configuration (service account for node fetching)
content:
  service:
    url: ${ALFRESCO_URL:http://localhost:80}
    security:
      basicAuth:
        username: ${ALFRESCO_INTERNAL_USERNAME:admin}
        password: ${ALFRESCO_INTERNAL_PASSWORD:admin}

alfresco:
  events:
    topic-name: ${ALFRESCO_EVENT_TOPIC:alfresco.repo.event2}
    enable-handlers: true
    enable-spring-integration: false

hxpr:
  url: ${HXPR_URL:http://localhost:8080}
  repository-id: ${HXPR_REPOSITORY_ID:default}
  target-path: ${HXPR_TARGET_PATH:/alfresco-sync}
  path-repository-id: ${HXPR_PATH_REPOSITORY_ID:}
  # HTTP Basic credentials for the ai-ready-index engine (filestore user store).
  username: ${HXPR_USERNAME:admin}
  password: ${HXPR_PASSWORD:password}

transform:
  url: ${TRANSFORM_URL:http://localhost:10090}
  timeout-ms: ${TRANSFORM_TIMEOUT_MS:300000}
  enabled: ${TRANSFORM_ENABLED:true}

# Text extraction representation.
#
# plaintext (default) asks the transform engine for text/plain, exactly as before: chunk boundaries,
# both fulltext mirrors and the resulting embeddings are unchanged. auto asks for text/markdown where
# the engine advertises it, so headings and table rows survive into chunking and a table becomes a
# ChunkType.TABLE chunk. markdown behaves like auto but logs each fall back to plaintext, which is the
# only way to tell "the engine is not producing markdown" from "markdown is working".
#
# The official Transform Core AIO advertises no markdown target, so auto is a no-op against it. Point
# transform.url at an engine that does (for example the transform-extras profile) to get markdown.
# Markdown is never required: extraction always degrades to plaintext and then to in-process Tika.
extraction:
  # Extra extraction services tried before the repository's own transform service, most structural
  # first. Comma separated, each optionally prefixed with a backend kind:
  #
  #   transform:http://transform-convert2md:8090,transform:http://transform-liteparse:8090
  #
  # An unprefixed entry means the alfresco-transform-core protocol. Other kinds (Document Filters, for
  # example) register an ExtractionBackend bean and are selected by their own prefix. Each service
  # claims only the MIME types it advertises, so a mixed list routes itself; order breaks ties.
  engine-urls: ${EXTRACTION_ENGINE_URLS:}
  format: ${EXTRACTION_FORMAT:plaintext}

embedding:
  model-name: ${EMBEDDING_MODEL:ai/mxbai-embed-large}

live-ingester:
  filter:
    exclude-paths:
      - "*/surf-config/*"
      - "*/thumbnails/*"
    exclude-aspects:
      - cm:workingcopy
  chunking:
    min-chunk-size: ${EMBEDDING_MIN_CHUNK_SIZE:200}
    max-chunk-size: ${EMBEDDING_CHUNK_SIZE:512}
    overlap-size: ${EMBEDDING_CHUNK_OVERLAP:150}
    similarity-threshold: ${EMBEDDING_SIMILARITY_THRESHOLD:0.75}
  dedup:
    window: ${LIVE_INGESTER_DEDUP_WINDOW:PT2M}
    max-entries: ${LIVE_INGESTER_DEDUP_MAX_ENTRIES:10000}
  reconcile:
    # Folder subtree reconciliation retries the AFTS ANCESTOR descendant query while it returns
    # empty, to absorb the search backend's index-commit lag (near-real-time with Solr; a polling
    # interval with the OpenSearch batch indexer on ACS 26.2+). Shares the batch ingester's env-var
    # names so one override tunes both. See issue #88.
    discovery:
      max-attempts: ${INGESTION_DISCOVERY_MAX_ATTEMPTS:10}
      retry-interval-ms: ${INGESTION_DISCOVERY_RETRY_INTERVAL_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.alfresco.contentlake: ${LOG_LEVEL:INFO}
    org.springframework.integration: ${INTEGRATION_LOG_LEVEL:INFO}
